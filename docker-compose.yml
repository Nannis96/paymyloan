# Produccion: imagen compilada, sin volumenes, sin node_modules en runtime.
# El TLS y el enrutamiento por dominio los maneja Nginx Proxy Manager desde
# el stack hermano "nginx-proxy-manager"; este compose ya no publica 80/443
# ni corre nginx/certbot propios. "landing" solo es alcanzable via la red
# compartida "paymyloan-edge".
#
# Primer arranque (con "paymyloan-edge" ya creada por el compose de
# nginx-proxy-manager, y un Proxy Host ahi apuntando a "landing:3000"):
#   docker compose up --build -d
services:
  landing:
    build:
      context: .
      target: runner
      args:
        # Se incrustan al compilar. Cambiarlas exige reconstruir la imagen.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://paymyloan.ai}
        NEXT_PUBLIC_REGISTRO_ENDPOINT: ${NEXT_PUBLIC_REGISTRO_ENDPOINT:-}
    image: paymyloan-landing:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    networks:
      - paymyloan-edge

networks:
  # Creada por el compose de nginx-proxy-manager; aca solo nos unimos.
  paymyloan-edge:
    external: true
