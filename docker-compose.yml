# Produccion: imagen compilada, sin volumenes, sin node_modules en runtime.
# nginx es el unico servicio publicado al host; "landing" solo es alcanzable
# dentro de la red interna de compose.
#   docker compose up --build
services:
  landing:
    build:
      context: .
      target: runner
      args:
        # Se incrustan al compilar. Cambiarlas exige reconstruir la imagen.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_REGISTRO_ENDPOINT: ${NEXT_PUBLIC_REGISTRO_ENDPOINT:-}
    image: paymyloan-landing:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - landing
    ports:
      # Unico puerto expuesto por ahora.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge
