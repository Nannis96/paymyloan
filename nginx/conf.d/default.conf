# "landing" resuelve por DNS interno de docker compose al servicio del
# mismo nombre; solo nginx queda expuesto al host (puertos 80 y 443).
upstream paymyloan_landing {
    server landing:3000;
}

# HTTP: solo sirve el reto ACME de certbot y redirige todo lo demas a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name paymyloan.ai www.paymyloan.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: termina TLS y reenvia a la landing.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name paymyloan.ai www.paymyloan.ai;

    ssl_certificate     /etc/letsencrypt/live/paymyloan.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paymyloan.ai/privkey.pem;

    # Perfil "intermediate" de Mozilla: sin cifrados DHE, así que no hace
    # falta generar ni distribuir un ssl-dhparams.pem.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets con hash en el nombre: Next los versiona, se pueden cachear
    # de forma permanente en el borde.
    location /_next/static/ {
        proxy_pass http://paymyloan_landing;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://paymyloan_landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
