# "landing" resuelve por DNS interno de docker compose al servicio del
# mismo nombre; solo este contenedor nginx queda expuesto al host (puerto 80).
upstream paymyloan_landing {
    server landing:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Assets con hash en el nombre: Next los versiona, se pueden cachear
    # de forma permanente en el borde.
    location /_next/static/ {
        proxy_pass http://paymyloan_landing;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://paymyloan_landing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
